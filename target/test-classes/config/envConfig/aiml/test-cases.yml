# RAG Test Cases Configuration
# Multiple test questions, answers, and expected contexts for comprehensive RAG validation

testCases:
  
  # Test Case 1: Available Tables Question
  case1:
    name: "Available Tables in Data Store"
    question: "What tables are available in the data store?"
    groundTruthContext: "The data store contains multiple tables including customer tables, order tables, lineitem tables, part tables, supplier tables, nation tables, and region tables. The TPCH_QA_RAG schema includes comprehensive tables for business analytics covering customer information, orders, line items, parts, suppliers, nations, and regions."
    expectedScore: 0.50
    enabled: true
  
  # Test Case 2: Customer Information Question
  case2:
    name: "Customer Information Schema"
    question: "What information is stored about customers?"
    groundTruthContext: "The customer table contains customer key, customer name, address, nation key, phone number, account balance, market segment, and comments. Customer information is essential for analyzing customer demographics and market segments."
    expectedScore: 0.50
    enabled: true
  
  # Test Case 3: Order Details Question
  case3:
    name: "Order Processing Data"
    question: "What order details are available in the system?"
    groundTruthContext: "The orders table stores order key, customer key, order status, total price, order date, required date, shipped date, and comments. Order processing includes details about shipment status and pricing information for business analytics."
    expectedScore: 0.50
    enabled: true
  
  # Test Case 4: Product/Part Information
  case4:
    name: "Product and Part Information"
    question: "What product information is stored in the data store?"
    groundTruthContext: "The part table contains part key, part name, manufacturer, brand, type, size, container type, retail price, and comment. Parts represent individual products with specifications and pricing for supply chain management."
    expectedScore: 0.50
    enabled: true
  
  # Test Case 5: Supplier Information
  case5:
    name: "Supplier Management Data"
    question: "What supplier details are available?"
    groundTruthContext: "The supplier table contains supplier key, supplier name, address, nation key, phone number, account balance, and comments. Supplier information is crucial for procurement and vendor management."
    expectedScore: 0.50
    enabled: true
  
  # Test Case 6: Geographic Information
  case6:
    name: "Geographic and Regional Data"
    question: "What geographic information is stored?"
    groundTruthContext: "The nation and region tables store geographic information including nation key, nation name, region key, and comments. Regional data is used for geographic analysis and market segmentation."
    expectedScore: 0.50
    enabled: true

# Evaluation Settings
evaluation:
  defaultThreshold: 0.30
  minScoreToPass: 0.30
  minCoveragePercentage: 30
  maxHallucinationPenalty: 0.10
  
# Test Execution Settings
execution:
  runParallel: false
  stopOnFirstFailure: false
  generateDetailedReport: true
  captureScreenshots: true
